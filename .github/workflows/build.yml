name: Build Fixora Windows Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compile agent
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" `
            /nologo `
            /target:exe `
            /optimize+ `
            /platform:anycpu `
            /win32manifest:src\FixoraAgent.manifest `
            /out:dist\FixoraAgent.exe `
            /reference:System.Management.dll `
            /reference:System.Web.Extensions.dll `
            /reference:lib\LibreHardwareMonitorLib.dll `
            src\FixoraAgent.cs
          Copy-Item -Recurse lib dist\lib
          Copy-Item README.md, LICENSE dist

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: Fixora-Agent-Windows
          path: dist
          if-no-files-found: error
